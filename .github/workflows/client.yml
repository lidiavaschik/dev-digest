# Client suite — Next.js web app (@devdigest/web).
# Typecheck + component/unit tests (vitest + jsdom). Hermetic: no API, no DB,
# no browser — fetch is mocked in the tests. The full-stack browser flow lives
# in e2e-web.yml.
name: client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Dependency advisories in PRODUCTION deps only — `--prod` drops the
      # dev-tool noise (vitest's UI-server CVE, testcontainers' transitives)
      # that never ships and never runs here.
      # NON-BLOCKING for now: as of 2026-09 this package still reports 11 high +
      # 2 critical prod advisories, mostly Next.js transitives, so a gating step
      # would go red on every PR for debt no single PR introduced. Ratchet:
      # triage the list, then drop continue-on-error.
      - name: Dependency audit (production deps, informational)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
