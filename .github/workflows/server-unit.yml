# Server unit suite — Fastify API (@devdigest/api), hermetic tests only.
#
# Two jobs:
#  - typecheck: type-check on Linux only — the platform CI and the exported
#    agent-runner both run on. We deliberately do NOT matrix over Windows/macOS:
#    macOS is covered by daily local dev, Windows is not a ship target, and
#    `@ast-grep/napi` is exact-pinned so its native binary only changes on a
#    deliberate version bump.
#  - unit: the ~19 DB-free test files (everything that is NOT `*.it.test.ts`).
#    LLM/git/embeddings are mocked via src/adapters/mocks.ts — no Docker.
#
# DB-backed tests run in server-integration.yml. reviewer-core/** is in the
# path filter because server aliases ../reviewer-core/src at type-check time.
name: server unit

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'reviewer-core/**'
      - '.github/workflows/server-unit.yml'

permissions:
  contents: read

concurrency:
  group: server-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The server type-checks reviewer-core's RAW source: tsconfig aliases
      # @devdigest/reviewer-core → ../reviewer-core/src, and platform/structured.ts
      # re-exports from it. That source imports `openai`/`zod`, so without
      # reviewer-core's deps installed, tsc fails with TS2307 → cascading
      # unknown→T errors. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      - run: pnpm typecheck

      # Dependency advisories in PRODUCTION deps only — `--prod` drops the
      # dev-tool noise (the lone "critical" is vitest's UI server, which this
      # repo never starts; testcontainers and drizzle-kit add the rest).
      # NON-BLOCKING for now: exactly ONE high remains as of 2026-09 —
      # drizzle-orm's SQL-injection advisory, fixed in >=0.45.2, which is a
      # 7-minor jump across the whole data layer and so needs its own change
      # with the integration suite as the safety net. The other transitives
      # (fast-uri, find-my-way, form-data) were cleared by refreshing the
      # lockfile. Ratchet: land the drizzle bump, then drop continue-on-error
      # and this step becomes a real gate.
      - name: Dependency audit (production deps, informational)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      # Onion-architecture boundaries (.claude/skills/onion-architecture).
      # Inlined rather than a package.json script: server/package.json is
      # skip-worktree. --ignore-known skips the pre-existing violations recorded
      # in .dependency-cruiser-known-violations.json — only NEW ones fail CI.
      - name: Architecture boundaries
        run: pnpm exec depcruise src --config .dependency-cruiser.cjs --ignore-known

  unit:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The unit tests load server src, which imports @devdigest/reviewer-core
      # (../reviewer-core/src) → which imports `openai`/`zod`. Install reviewer-core's
      # deps so those resolve at module load. reviewer-core uses npm (see reviewer-core.yml).
      - name: Install reviewer-core deps
        working-directory: reviewer-core
        run: npm ci

      # Inlined rather than `pnpm test:unit`: server/package.json is
      # skip-worktree (a local variant), so the committed package.json may
      # not carry the split scripts. Run vitest directly.
      - run: pnpm exec vitest run --exclude '**/*.it.test.ts'
